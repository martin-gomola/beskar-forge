# Render Blueprint for Beskar Forge.
#
# The frontend is a free static site on Render's CDN. The FastAPI backend is a
# separate free Docker web service, so the frontend calls it cross-origin.
# Create a Blueprint from this repository in the Render dashboard.

services:
  # FastAPI backend. Render injects PORT; backend/Dockerfile honors it.
  - type: web
    name: beskar-forge-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: CORS_ORIGINS
        value: https://beskar-forge.onrender.com
      - key: TRUSTED_HOSTS
        value: beskar-forge-api.onrender.com
      - key: LOG_LEVEL
        value: INFO
      # Keep the value in Render; never commit a real API key.
      - key: APP_API_KEY
        sync: false

  # Vite frontend. Static sites are free and globally CDN-served.
  - type: web
    name: beskar-forge
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        value: https://beskar-forge-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive, nosnippet, noimageindex
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-store
